const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arWrap=s=>esc(s).replace(/([؀-ۿﷰ-﷿][؀-ۿﷰ-﷿ً-ٟ\s،]*[؀-ۿﷰ-﷿ً-ٟ])|([؀-ۿ])/g,m=>`<span class="ar" dir="rtl">${m}</span>`);
const secOf=n=>SECTIONS.find(s=>n>=s.from&&n<=s.to);
const paperOf=src=>Object.keys(PAPERS).find(p=>src.startsWith(p));
function letters(sub,q){return q.o.length===2?["",""]:SUBJ[sub].letters}
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{attempts:[]}}catch(e){return{attempts:[]}}}
function save(d){try{localStorage.setItem(STORE,JSON.stringify(d))}catch(e){}}

/* ============ STATE ============ */
const st={hints:{},mode:"murid",sub:"ar",answers:{},submitted:false,name:"",auth:false,gsub:"ar",fPaper:"",fTopic:"",fLv:"",fText:""};
try{st.auth=sessionStorage.getItem("d5auth")==="1"}catch(e){}

/* ============ LATIHAN MURID ============ */
function renderMurid(){
  const S=SUBJ[st.sub];
  let h=`<div><h1>Latihan Darjah 5</h1><p class="lead">Pilih subjek, jawab 65 soalan (50 soalan utama + 15 soalan ekstra PAT 2022), kemudian hantar untuk melihat markah. Setiap soalan ditag dengan kertas sebenar. Tekan "Tunjuk petunjuk" jika perlukan bantuan; petunjuk diambil daripada nota ringkas Darjah 5.</p></div>
  <div class="subjects">${Object.values(SUBJ).map(s=>`<button class="subj" data-sub="${s.key}" aria-pressed="${s.key===st.sub}"><span class="ttl"><b>${s.name}</b><span class="arname" dir="rtl">${s.arname}</span></span><small>65 soalan · 6 bahagian · rujukan PAT 2022–2025, PPT &amp; UPP2 2026</small></button>`).join("")}</div>
  <div class="row"><label for="nm" class="muted">Nama murid</label><input id="nm" type="text" placeholder="cth: Ahmad bin Ali" value="${esc(st.name)}" style="flex:1;min-width:0;max-width:340px"></div>`;
  if(st.submitted){
    const r=scoreOf(st.sub,st.answers);
    h+=`<div class="score"><div class="big">${r.c}/${r.t}</div><div><b>${r.pct}% · ${grade(r.pct)}</b><div class="muted">Soalan bertanda merah perlu diulang kaji. Jawapan penuh dan penerangan ada dalam Dashboard Muallim.</div></div></div>`;
  }
  SECTIONS.forEach(sec=>{
    h+=`<div class="sec-head"><h2>${sec.name}</h2><span>${sec.note}</span></div>`;
    S.data.filter(q=>q.n>=sec.from&&q.n<=sec.to).forEach(q=>h+=qCard(st.sub,q,false));
  });
  $("#view-murid").innerHTML=h;
  updBar();
}
function qCard(sub,q,showKey){
  const S=SUBJ[sub],L=letters(sub,q),pick=st.answers[q.n];
  let cls="q";
  if(!showKey&&st.submitted&&st.sub===sub) cls+=pick===q.a?" ok":" bad";
  const mark=(!showKey&&st.submitted)?(pick===q.a?`<span class="mark ok">✓ Betul</span>`:`<span class="mark bad">✗ ${pick===undefined?"Tidak dijawab":"Salah"}</span>`):"";
  return `<article class="${cls}" id="${showKey?"k":"q"}${sub}${q.n}">
   <div class="qmeta"><span class="num">${q.n}</span>${q.src.map(s=>`<span class="chip" title="${esc(PAPERS[paperOf(s)]||"")}">${esc(s)}</span>`).join("")}<span class="chip topic">${arWrap(q.t)}</span>${q.d?`<span class="chip lv lv-${q.d}">Aras: ${q.d}</span>`:""}${mark}</div>
   <div class="qtext ${S.rtl?"rtl":""}" ${S.rtl?'dir="rtl"':""}>${S.rtl?esc(q.q):arWrap(q.q)}</div>
   <div class="opts ${S.rtl?"rtl":""}">${q.o.map((o,i)=>`<button class="opt${showKey&&i===q.a?" key":""}" data-q="${q.n}" data-i="${i}" ${showKey||st.submitted?"disabled":""} aria-pressed="${!showKey&&pick===i}">${L[i]?`<span class="lt">${L[i]}</span>`:""}<span class="tx">${S.rtl?esc(o):arWrap(o)}</span></button>`).join("")}</div>
   ${!showKey?`<div class="hint"><button class="hintbtn" data-hint="${sub}${q.n}" aria-expanded="${!!st.hints[sub+q.n]}">${st.hints[sub+q.n]?"Sembunyi petunjuk":"Tunjuk petunjuk"}</button><div class="hinttx" ${st.hints[sub+q.n]?"":"hidden"}>${arWrap(q.h)}</div></div>`:""}
   ${showKey?`<div class="explain"><b>Jawapan: ${L[q.a]?L[q.a]+" · ":""}</b>${arWrap(q.o[q.a])}<br>${arWrap(q.ex)}<div class="ref"><b>Petunjuk murid:</b> ${arWrap(q.h)}</div><div class="ref"><b>Rujukan nota / buku teks D5:</b> ${arWrap(q.r)}</div></div>`:""}
  </article>`;
}
function scoreOf(sub,ans){const d=SUBJ[sub].data;const c=d.filter(q=>ans[q.n]===q.a).length;return{c,t:d.length,pct:Math.round(c/d.length*100)}}
function grade(p){return p>=85?"Cemerlang":p>=70?"Kepujian":p>=50?"Lulus":"Perlu bimbingan"}
function updBar(){
  const show=st.mode==="murid";$("#bar").hidden=!show;if(!show)return;
  const n=Object.keys(st.answers).length;
  const T=SUBJ[st.sub].data.length;$("#prog").textContent=st.submitted?`Markah: ${scoreOf(st.sub,st.answers).c}/${T}`:`Dijawab ${n}/${T}`;
  $("#btn-submit").hidden=st.submitted;
}
$("#view-murid").addEventListener("click",e=>{
  const sb=e.target.closest(".subj");
  if(sb){if(sb.dataset.sub!==st.sub){st.sub=sb.dataset.sub;st.answers={};st.hints={};st.submitted=false;renderMurid();}return;}
  const hb=e.target.closest(".hintbtn");
  if(hb){const k=hb.dataset.hint;st.hints[k]=!st.hints[k];hb.setAttribute("aria-expanded",st.hints[k]);hb.textContent=st.hints[k]?"Sembunyi petunjuk":"Tunjuk petunjuk";hb.nextElementSibling.hidden=!st.hints[k];return;}
  const op=e.target.closest(".opt");
  if(op&&!st.submitted){st.answers[+op.dataset.q]=+op.dataset.i;
    op.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b===op));updBar();}
});
$("#view-murid").addEventListener("input",e=>{if(e.target.id==="nm")st.name=e.target.value});
$("#btn-submit").addEventListener("click",()=>{
  const n=Object.keys(st.answers).length;
  const T=SUBJ[st.sub].data.length;if(n<T&&!$("#btn-submit").dataset.warn){$("#btn-submit").dataset.warn="1";$("#btn-submit").textContent=`${T-n} belum dijawab. Tekan lagi untuk hantar`;return;}
  delete $("#btn-submit").dataset.warn;$("#btn-submit").textContent="Hantar & semak markah";
  st.submitted=true;const r=scoreOf(st.sub,st.answers);
  const d=load();d.attempts.unshift({name:st.name.trim()||"Tanpa nama",sub:st.sub,score:r.c,total:r.t,pct:r.pct,ans:{...st.answers},at:new Date().toISOString()});d.attempts=d.attempts.slice(0,300);save(d);
  renderMurid();window.scrollTo({top:0,behavior:"smooth"});
});
$("#btn-reset").addEventListener("click",()=>{st.answers={};st.hints={};st.submitted=false;delete $("#btn-submit").dataset.warn;$("#btn-submit").textContent="Hantar & semak markah";renderMurid();});

/* ============ DASHBOARD MUALLIM ============ */
function renderGuru(){
  const V=$("#view-guru");
  if(!st.auth){
    V.innerHTML=`<div class="panel login"><h1>Dashboard Muallim</h1><p class="lead">Log masuk untuk melihat skema jawapan, penerangan dan rekod murid.</p>
    <form id="lf" autocomplete="off"><label for="lu">ID</label><input id="lu" type="text" required><label for="lp">Kata laluan</label><input id="lp" type="password" required><div class="err" id="lerr"></div><button class="btn primary" type="submit">Log masuk</button></form></div>`;
    return;
  }
  const S=SUBJ[st.gsub],D=S.data;
  const topics=[...new Set(D.map(q=>q.t))];
  const paperCount=Object.keys(PAPERS).map(p=>({p,c:D.filter(q=>q.src.some(s=>s.startsWith(p))).length}));
  const tags=D.reduce((a,q)=>a+q.src.length,0);
  const list=D.filter(q=>(!st.fPaper||q.src.some(s=>s.startsWith(st.fPaper)))&&(!st.fTopic||q.t===st.fTopic)&&(!st.fLv||(st.fLv==="Utama"?!q.d:q.d===st.fLv))&&(!st.fText||(q.q+q.o.join(" ")+q.ex+q.h+q.r+q.src.join(" ")).toLowerCase().includes(st.fText.toLowerCase())));
  const att=load().attempts.filter(a=>a.sub===st.gsub);
  // analisis item
  const wrong=D.map(q=>({n:q.n,w:att.filter(a=>a.ans[q.n]!==q.a).length})).sort((a,b)=>b.w-a.w).filter(x=>x.w>0).slice(0,5);
  V.innerHTML=`
  <div class="row" style="justify-content:space-between"><div><h1>Dashboard Muallim</h1><p class="lead">Skema jawapan, penerangan dan tagging kertas sebenar.</p></div><button class="btn" id="logout">Log keluar</button></div>
  <div class="subjects" style="margin-top:0">${Object.values(SUBJ).map(s=>`<button class="subj" data-gsub="${s.key}" aria-pressed="${s.key===st.gsub}"><span class="ttl"><b>${s.name}</b><span class="arname" dir="rtl">${s.arname}</span></span><small>Skema ${s.data.length} soalan</small></button>`).join("")}</div>
  <div class="kpis">
    <div class="kpi"><b>${D.length}</b><span>Soalan ${S.name}</span></div>
    <div class="kpi"><b>${["Senang","Sederhana","Susah"].map(l=>D.filter(q=>q.d===l).length).join(" : ")}</b><span>Aras ekstra (senang : sederhana : susah)</span></div>
    <div class="kpi"><b>${tags}</b><span>Tag ke soalan sebenar</span></div>
    <div class="kpi"><b>${topics.length}</b><span>Topik</span></div>
    <div class="kpi"><b>${att.length}</b><span>Percubaan murid (peranti ini)</span></div>
  </div>
  <div class="panel stack"><h2>Liputan kertas sebenar</h2>
   <div class="tbl-wrap"><table><thead><tr><th>Kertas</th><th>Keterangan</th><th>Bil. soalan bertag</th></tr></thead><tbody>
   ${paperCount.map(x=>`<tr><td><b>${x.p}</b></td><td>${PAPERS[x.p]}</td><td class="n">${x.c}</td></tr>`).join("")}</tbody></table></div>
   <p class="muted" style="margin:0">Satu soalan boleh membawa lebih daripada satu tag jika topik yang sama muncul dalam beberapa kertas. Format S = nombor soalan dalam kertas asal.</p></div>
  <div class="panel stack"><h2>Skema jawapan ringkas</h2>
   <div class="keygrid">${D.map(q=>{const L=letters(st.gsub,q);return `<div>${q.n}<b ${S.rtl&&q.o.length===2?'dir="rtl"':""}>${q.o.length===2?(st.gsub==="ar"?(q.a===0?"صحيح":"خطأ"):(q.a===0?"B":"S")):L[q.a]}</b></div>`}).join("")}</div></div>
  <div class="panel stack"><h2>Rekod murid</h2>
   ${att.length?`<div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Markah</th><th>Gred</th><th>Tarikh</th></tr></thead><tbody>${att.slice(0,50).map(a=>`<tr><td>${esc(a.name)}</td><td class="n">${a.score}/${a.total||50} (${a.pct}%)</td><td>${grade(a.pct)}</td><td class="n">${new Date(a.at).toLocaleString("ms-MY")}</td></tr>`).join("")}</tbody></table></div>
   ${wrong.length?`<p style="margin:0"><b>Soalan paling banyak salah:</b> ${wrong.map(x=>`S${x.n} (${x.w})`).join(", ")}</p>`:""}
   <div class="inline-confirm" id="clr"><button class="btn danger" id="clr1">Padam rekod ${S.name}</button></div>`
   :`<p class="muted" style="margin:0">Belum ada rekod. Markah murid yang menjawab di peranti ini akan tersimpan di sini secara automatik.</p>`}
  </div>
  <div class="panel stack"><h2>Soalan, jawapan &amp; penerangan</h2>
   <div class="filters">
    <select id="fp"><option value="">Semua kertas</option>${Object.keys(PAPERS).map(p=>`<option ${p===st.fPaper?"selected":""}>${p}</option>`).join("")}</select>
    <select id="ft"><option value="">Semua topik</option>${topics.map(t=>`<option ${t===st.fTopic?"selected":""}>${esc(t)}</option>`).join("")}</select>
    <select id="fl"><option value="">Semua aras</option>${["Utama","Senang","Sederhana","Susah"].map(l=>`<option value="${l}" ${l===st.fLv?"selected":""}>${l==="Utama"?"Set utama (1–50)":"Ekstra · "+l}</option>`).join("")}</select>
    <input id="fx" type="text" placeholder="Cari kata kunci / S12" value="${esc(st.fText)}">
   </div>
   <p class="muted" style="margin:0">Memaparkan ${list.length} daripada ${D.length} soalan.</p>
  </div>
  <div class="stack" id="glist">${list.map(q=>qCard(st.gsub,q,true)).join("")}</div>`;
}
$("#view-guru").addEventListener("submit",e=>{
  if(e.target.id!=="lf")return;e.preventDefault();
  if($("#lu").value.trim()==="admin"&&$("#lp").value==="admin"){st.auth=true;try{sessionStorage.setItem("d5auth","1")}catch(err){}renderGuru();}
  else $("#lerr").textContent="ID atau kata laluan tidak betul. Cuba lagi.";
});
$("#view-guru").addEventListener("click",e=>{
  if(e.target.id==="logout"){st.auth=false;try{sessionStorage.removeItem("d5auth")}catch(err){}renderGuru();return;}
  const g=e.target.closest("[data-gsub]");if(g){st.gsub=g.dataset.gsub;st.fTopic="";renderGuru();return;}
  if(e.target.id==="clr1"){$("#clr").innerHTML=`<span>Padam semua rekod ${SUBJ[st.gsub].name}?</span><button class="btn danger" id="clr2">Ya, padam</button><button class="btn" id="clr0">Batal</button>`;return;}
  if(e.target.id==="clr0"){renderGuru();return;}
  if(e.target.id==="clr2"){const d=load();d.attempts=d.attempts.filter(a=>a.sub!==st.gsub);save(d);renderGuru();}
});
$("#view-guru").addEventListener("change",e=>{
  if(e.target.id==="fp"){st.fPaper=e.target.value;renderGuru();}
  if(e.target.id==="ft"){st.fTopic=e.target.value;renderGuru();}
  if(e.target.id==="fl"){st.fLv=e.target.value;renderGuru();}
});
let tmr;$("#view-guru").addEventListener("input",e=>{if(e.target.id==="fx"){st.fText=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{renderGuru();const x=$("#fx");x.focus();x.setSelectionRange(x.value.length,x.value.length)},250)}});

/* ============ TAB ============ */
function setMode(m){st.mode=m;$("#tab-murid").setAttribute("aria-pressed",m==="murid");$("#tab-guru").setAttribute("aria-pressed",m==="guru");
  $("#view-murid").hidden=m!=="murid";$("#view-guru").hidden=m!=="guru";if(m==="guru")renderGuru();else renderMurid();updBar();window.scrollTo(0,0);}
$("#tab-murid").onclick=()=>setMode("murid");$("#tab-guru").onclick=()=>setMode("guru");
renderMurid();
</script>

</body></html>
